name: Bug Report
description: Report a problem with the ScissorHands.NET theme starter.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the theme starter!
        Report suspected vulnerabilities privately using SECURITY.md, not here.
        Remove secrets and private content from examples, logs, and screenshots.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what you see!
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Describe the theme or sample configuration.
        2. List the commands or browser actions used.
        3. Describe the error or unexpected output.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add desktop or mobile screenshots showing the problem.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Include the affected revision and package versions. For browser issues,
        include desktop or mobile device details and the browser version.
      placeholder: |
        - OS: [e.g. Windows 11, macOS 15, Ubuntu 24.04]
        - Device: [desktop or mobile model]
        - Browser and version:
        - .NET SDK version (dotnet --version):
        - Theme repository revision:
        - ScissorHands package versions:
        - Run mode: [preview or build]
        - Site.BaseUrl path, if relevant: [e.g. / or /blog/]
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context about the problem here.

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true