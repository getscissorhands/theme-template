name: CI

on:
  push:
    branches:
      - main
      - "build/*"
      - "chore/*"
      - "ci/*"
      - "docs/*"
      - "feat/*"
      - "fix/*"
      - "perf/*"
      - "refactor/*"
      - "revert/*"
      - "style/*"
      - "test/*"
  pull_request:
    branches:
      - main
  create:

permissions:
  contents: read

jobs:
  branch-name:
    name: Check new branch name
    if: ${{ github.event_name == 'create' && github.event.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check conventional type prefix
        shell: bash
        env:
          BRANCH_NAME: ${{ github.event.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$BRANCH_NAME" == "$DEFAULT_BRANCH" ]]; then
            echo "The default branch is exempt from the naming convention."
            exit 0
          fi

          if [[ ! "$BRANCH_NAME" =~ ^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Use a branch name such as feat/theme-navigation or fix/tag-links (type/lowercase-kebab-case)."
            exit 1
          fi

  build:
    name: Build theme and sample
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Link sample theme
        shell: pwsh
        run: |
          $settings = Get-Content -LiteralPath "sample/appsettings.json" -Raw | ConvertFrom-Json
          $theme = $settings.Site.Theme
          if ([string]::IsNullOrWhiteSpace($theme)) {
            throw "Site:Theme must identify the sample theme."
          }
          $linkPath = Join-Path "sample/themes" $theme
          if (-not (Test-Path -LiteralPath $linkPath)) {
            New-Item -ItemType Directory -Path "sample/themes" -Force | Out-Null
            New-Item -ItemType SymbolicLink -Path $linkPath -Target "../../src" | Out-Null
          }

      - name: Restore packages
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Generate sample site
        working-directory: sample
        run: dotnet run --configuration Release --no-build -- --build
