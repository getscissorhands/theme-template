name: Initialize template repository

# GitHub has no native "created from template" event. Creating a repository
# from a template creates its default branch, which emits this initial push.
on:
  push:

jobs:
  initialize:
    if: ${{ github.event.created && github.ref_name == github.event.repository.default_branch && !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REPOSITORY_NAME: ${{ github.event.repository.name }}
      REPOSITORY_DESCRIPTION: ${{ github.event.repository.description }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}

    steps:
      - name: Normalize theme slug
        shell: pwsh
        run: |
          $themeSlug = ($env:REPOSITORY_NAME -replace '[_.]', '-').ToLowerInvariant()
          if ($themeSlug -notmatch '[a-z0-9]') {
            throw "Theme slug '$themeSlug' from repository '$env:REPOSITORY_NAME' must contain at least one letter or digit."
          }

          $reservedSlugs = @(
            "default",
            "plugin-template",
            "plugins",
            "scissorhands-core",
            "scissorhands-plugin",
            "scissorhands-theme",
            "scissorhands-web",
            "theme-template"
          )
          if ($themeSlug -in $reservedSlugs) {
            throw "Theme slug '$themeSlug' from repository '$env:REPOSITORY_NAME' is reserved. Choose a different repository name."
          }

          Add-Content -LiteralPath $env:GITHUB_ENV -Value "THEME_SLUG=$themeSlug" -Encoding utf8

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Initialize project
        shell: pwsh
        run: |
          $projectPath = "src/ThemeTemplate.csproj"
          $renamedProjectPath = "src/$env:THEME_SLUG.csproj"
          $solutionPath = "ThemeTemplate.slnx"
          $renamedSolutionPath = "$env:THEME_SLUG.slnx"
          $settingsPath = "sample/appsettings.json"
          $manifestPath = "src/theme.json"
          $importsPath = "src/_Imports.razor"
          $themeLinkPath = "sample/themes/$env:THEME_SLUG"

          if ($projectPath -cne $renamedProjectPath) {
            Move-Item -LiteralPath $projectPath -Destination $renamedProjectPath
          }

          $solution = Get-Content -LiteralPath $solutionPath -Raw
          $updatedSolution = $solution.Replace($projectPath, $renamedProjectPath)
          if (!$solution.Contains($projectPath)) {
            throw "Project path '$projectPath' was not found in '$solutionPath'."
          }
          Set-Content -LiteralPath $solutionPath -Value $updatedSolution -NoNewline
          if ($solutionPath -cne $renamedSolutionPath) {
            Move-Item -LiteralPath $solutionPath -Destination $renamedSolutionPath
          }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $manifest.name = $env:REPOSITORY_NAME
          $manifest.slug = $env:THEME_SLUG
          if ([string]::IsNullOrWhiteSpace($env:REPOSITORY_DESCRIPTION)) {
            $manifest.description = "A theme, called $env:REPOSITORY_NAME, for ScissorHands.NET"
          } else {
            $manifest.description = $env:REPOSITORY_DESCRIPTION
          }
          $manifest |
            ConvertTo-Json -Depth 100 |
            Set-Content -LiteralPath $manifestPath

          $namespaceSuffix = ($env:THEME_SLUG -split '-' |
            Where-Object { $_.Length -gt 0 } |
            ForEach-Object { $_.Substring(0, 1).ToUpperInvariant() + $_.Substring(1) }) -join ''
          if ($namespaceSuffix -match '^[0-9]') {
            $namespaceSuffix = "_$namespaceSuffix"
          }
          $imports = Get-Content -LiteralPath $importsPath -Raw
          $imports = $imports.Replace('ScissorHands.Theme.Template', "ScissorHands.Theme.$namespaceSuffix")
          Set-Content -LiteralPath $importsPath -Value $imports -NoNewline

          foreach ($docPath in @("AGENTS.md", "README.md", "sample/README.md")) {
            $doc = Get-Content -LiteralPath $docPath -Raw
            $doc = $doc.Replace('<theme-slug>', $env:THEME_SLUG)
            if ($docPath -ne "AGENTS.md") {
              $doc = $doc.Replace('ThemeTemplate.csproj', "$env:THEME_SLUG.csproj")
            }
            Set-Content -LiteralPath $docPath -Value $doc -NoNewline
          }

          $settings = Get-Content -LiteralPath $settingsPath -Raw | ConvertFrom-Json
          $settings.Site.Author = $env:REPOSITORY_OWNER
          $settings.Site.Theme = $env:THEME_SLUG
          $settings.Site.Title = "ScissorHands.NET - $env:REPOSITORY_NAME"
          $settings |
            ConvertTo-Json -Depth 100 |
            Set-Content -LiteralPath $settingsPath

          New-Item -ItemType Directory -Path "sample/themes" -Force | Out-Null
          New-Item -ItemType SymbolicLink -Path $themeLinkPath -Target "../../src" | Out-Null

      - name: Commit initialization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/init.yml
          git add --all
          git add --force "sample/themes/${THEME_SLUG}"
          git commit -m "chore: initialize template repository"
          git push
