name: Build and release

on:
  push:
    branches:
      - main
      - "build/*"
      - "chore/*"
      - "ci/*"
      - "docs/*"
      - "feat/*"
      - "fix/*"
      - "perf/*"
      - "refactor/*"
      - "revert/*"
      - "style/*"
      - "test/*"
    tags:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build theme and sample
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Link sample theme
        shell: pwsh
        run: |
          $settings = Get-Content -LiteralPath "sample/appsettings.json" -Raw | ConvertFrom-Json
          $theme = $settings.Site.Theme
          if ([string]::IsNullOrWhiteSpace($theme)) {
            throw "Site:Theme must identify the sample theme."
          }
          $linkPath = Join-Path "sample/themes" $theme
          if (-not (Test-Path -LiteralPath $linkPath)) {
            New-Item -ItemType Directory -Path "sample/themes" -Force | Out-Null
            New-Item -ItemType SymbolicLink -Path $linkPath -Target "../../src" | Out-Null
          }

      - name: Restore packages
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      # Uncomment after adding test projects to the solution.
      # - name: Test solution
      #   run: dotnet test --configuration Release --no-build --no-restore

  release:
    name: Create GitHub release
    if: ${{ github.event_name == 'push' && github.event.created && startsWith(github.ref, 'refs/tags/') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check release version
        id: version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $numeric = '(0|[1-9][0-9]*)'
          $prereleaseIdentifier = '(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)'
          $buildIdentifier = '[0-9a-zA-Z-]+'
          $pattern = "\Av(?<version>$numeric\.$numeric\.$numeric(?:-(?<prerelease>$prereleaseIdentifier(?:\.$prereleaseIdentifier)*))?(?:\+$buildIdentifier(?:\.$buildIdentifier)*)?)\z"
          $match = [regex]::Match($env:TAG_NAME, $pattern)
          if (-not $match.Success) {
            throw "Tag '$env:TAG_NAME' must be a v-prefixed SemVer version, such as v1.2.3 or v1.2.3-preview.1."
          }
          "version=$($match.Groups['version'].Value)" >> $env:GITHUB_OUTPUT
          "prerelease=$($match.Groups['prerelease'].Success.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Create release with generated notes
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
